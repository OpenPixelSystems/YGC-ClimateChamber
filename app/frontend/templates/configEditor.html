{% extends "base.html" %}
{% block title %}Configuration Editor{% endblock %}

{% block content %}
<div class="container">
    <div class="input-section">
        <h1>Configuration Editor</h1>
        <div class="control-group">
            <label for="filename">Select configuration file:</label>
            <select name="filename" id="filename" class="full-width">
                {% for fname in config_files %}
                    <option value="{{ fname }}" {% if fname == selected_file %}selected{% endif %}>{{ fname }}</option>
                {% endfor %}
            </select>
        </div>

        <h2>Currently editing: <span style="color:var(--accent-color);">{{ selected_file }}</span></h2>

        <div class="button-group">
            <button id="save-config-btn" type="submit" class="full-width">Save Configuration</button>
            <button type="button" class="full-width" onclick="window.location.href='/'">Back to Home</button>
        </div>
    </div>

    <div class="graph-section">
        <div id="config-form" class="config-container"></div>
    </div>
</div>

<style>
.config-container {
    height: 100%;
    overflow-y: auto;
    padding: 20px;
}

.config-group {
    background: var(--card-background);
    margin-bottom: 20px;
    padding: 16px;
    border-radius: 8px;
    box-shadow: 0 2px 4px var(--shadow-color);
}

.config-header h3 {
    margin: 0 0 16px 0;
    color: var(--text-color);
    font-size: 1.2em;
    border-bottom: 2px solid var(--shadow-color);
    padding-bottom: 8px;
}

.config-fields {
    display: grid;
    gap: 16px;
}

.config-field {
    display: flex;
    flex-direction: column;
}

.config-field label {
    margin-bottom: 8px;
    font-weight: 500;
    color: var(--text-color);
}

.config-field input,
.config-field select {
    padding: 8px 12px;
    border: 1px solid var(--shadow-color);
    border-radius: 4px;
    background: var(--card-background);
    color: var(--text-color);
    font-size: 14px;
}

.config-field input:focus,
.config-field select:focus {
    outline: none;
    border-color: #4CAF50;
    box-shadow: 0 0 0 2px rgba(76, 175, 80, 0.2);
}

.control-group {
    margin-bottom: 20px;
    padding: 16px;
    background: var(--card-background);
    border-radius: 6px;
    border: 1px solid var(--shadow-color);
}
</style>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/config-editor.js') }}" type="module"></script>
{% endblock %}
