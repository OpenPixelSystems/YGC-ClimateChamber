<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        // Immediate dark mode initialization to prevent flash
        (function() {
            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            if (isDarkMode) {
                document.documentElement.classList.add('dark-mode');
            }
        })();
    </script>
    {% block head %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/fontawesome-local.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/main.css') }}">
    <script src="{{ url_for('static', filename='js/base.js') }}"></script>
    {% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="nav-links">
            <a href="{{ url_for('home.index') }}" class="nav-link">Home</a>
            <a href="{{ url_for('graph.setup_graph') }}" class="nav-link">Graph Setup</a>
            <a href="{{ url_for('flow.flow_designer') }}" class="nav-link">Temperature Flow</a>
            <a href="{{ url_for('viewer.view_database') }}" class="nav-link">Database viewer</a>
            <a href="{{ url_for('logs.logs_viewer') }}" class="nav-link">Logs</a>
            <a href="#" id="activeCycleLink" class="nav-link" style="display: none;">Active Cycle</a>
        </div>
        <div class="nav-controls">
            <div class="storage-indicator" id="storageIndicator" title="Storage Usage">
                <div class="storage-icon">💾</div>
                <div class="storage-bar">
                    <div class="storage-fill" id="storageFill"></div>
                </div>
                <div class="storage-text" id="storageText">--</div>
            </div>
            <button onclick="navigateToWifi()" class="icon-button" title="WiFi Networks">
                <i class="fas fa-wifi"></i>
            </button>
            <button onclick="navigateToSettings()" class="icon-button" title="System Configuration">
                <i class="fas fa-cog"></i>
            </button>
            <button onclick="restartService()" class="icon-button restart-button" title="Restart Climate Chamber Service">
                <i class="fas fa-redo"></i>
            </button>
            <button onclick="toggleDarkMode()" class="icon-button" title="Toggle Dark Mode">
                <i class="fas fa-adjust"></i>
            </button>
        </div>
    </nav>
    {% block content %}{% endblock %}
    {% block scripts %}{% endblock %}
</body>
</html>
