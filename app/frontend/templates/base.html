<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        (function() {
            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            if (isDarkMode) {
                document.documentElement.classList.add('dark-mode');
            }
        })();
    </script>
    {% block head %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/main.css') }}">
    <script>
        function toggleDarkMode() {
            document.documentElement.classList.toggle('dark-mode');
            const isDarkMode = document.documentElement.classList.contains('dark-mode');
            localStorage.setItem('darkMode', isDarkMode);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const isDarkMode = localStorage.getItem('darkMode') === 'true';
            if (isDarkMode) {
                document.documentElement.classList.add('dark-mode');
            } else {
                document.documentElement.classList.remove('dark-mode');
            }
        });
    </script>
    {% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="nav-links">
            <a href="{{ url_for('home.index') }}" class="nav-link">Home</a>
            <a href="{{ url_for('graph.setup_graph') }}" class="nav-link">Graph Setup</a>
            <a href="{{ url_for('viewer.view_database') }}" class="nav-link">Database viewer</a>
        </div>
        <div class="nav-controls">
            <a href="{{ url_for('config.edit_config') }}" class="icon-button" title="System Configuration">
                ⚙️
            </a>
            <button onclick="toggleDarkMode()" class="icon-button" title="Toggle Dark Mode">
                🌓
            </button>
        </div>
    </nav>
    {% block content %}{% endblock %}
    {% block scripts %}{% endblock %}
</body>
</html>
