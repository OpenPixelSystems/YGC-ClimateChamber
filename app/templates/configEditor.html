{% extends "base.html" %}
{% block title %}Configuration Editor{% endblock %}

{% block content %}
<div class="container">
    <div class="input-section">
        <h1>Configuration Editor</h1>
        <form id="fileSelectForm" method="get" action="{{ url_for('config.edit_config') }}" style="margin-bottom: 20px;">
            <label for="filename">Select configuration file:</label>
            <select name="filename" id="filename">
                {% for fname in config_files %}
                    <option value="{{ fname }}" {% if fname == selected_file %}selected{% endif %}>{{ fname }}</option>
                {% endfor %}
            </select>
        </form>

        <h2 style="margin-top:0;">Currently editing: <span style="color:var(--accent-color);">{{ selected_file }}</span></h2>

        <form id="config-form"></form>

        <div class="button-group">
            <button id="save-config-btn" type="submit" class="full-width">Save Configuration</button>
            <button type="button" class="full-width" onclick="window.location.href='/'">Back to Home</button>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/config-editor.js') }}" type="module"></script>
{% endblock %}
